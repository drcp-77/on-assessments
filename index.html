<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#005EB8">
  <meta name="description" content="A private, offline-capable interview coach for assessment design roles in UK awarding organisations.">
  <title>Assessment Interview Coach</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <div><strong>Assessment Coach</strong><small>Interview preparation</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-actions">
      <button class="icon-btn" id="darkToggle" aria-label="Toggle dark mode">◐ <span>Dark mode</span></button>
      <button class="icon-btn" id="resetProgress" aria-label="Reset saved progress">↺ <span>Reset progress</span></button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open navigation">☰</button>
      <div class="top-title"><strong id="pageTitle">Dashboard</strong><small id="pageSubtitle">Your personalised preparation plan</small></div>
      <div class="top-actions">
        <button class="btn secondary" id="readPage">🔊 Read page</button>
        <button class="btn primary" data-go="mock">Start mock interview</button>
      </div>
    </header>

    <main id="main" tabindex="-1"></main>
  </div>
</div>

<section class="audio-dock" id="audioDock" aria-label="Audio player">
  <div class="audio-meta">
    <span class="audio-icon">🎧</span>
    <div><strong id="audioTitle">Audiobook mode</strong><small id="audioStatus">Ready</small></div>
  </div>
  <div class="audio-controls">
    <button id="audioRestart" title="Restart">↶</button>
    <button id="audioPlay" title="Play">▶</button>
    <button id="audioPause" title="Pause">Ⅱ</button>
    <button id="audioStop" title="Stop">■</button>
  </div>
  <div class="audio-progress-wrap"><progress id="audioProgress" value="0" max="100"></progress><span id="audioPct">0%</span></div>
  <label class="compact">Voice<select id="voiceSelect" aria-label="British English voice"></select></label>
  <label class="compact">Speed<select id="rateSelect" aria-label="Playback speed"><option>.75</option><option selected>.9</option><option>1</option><option>1.1</option><option>1.25</option></select></label>
  <label class="toggle"><input type="checkbox" id="continuousMode"> Continuous</label>
  <button id="readSelection" class="dock-link">Read selection</button>
  <button id="closeAudio" aria-label="Hide audio controls">×</button>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
